# Keeps the Hacktoberfest Supabase project awake. Free Supabase projects pause after
# about a week without activity, which would stop students downloading certificates.
# Every 3 days this asks the verify-certificate function about a dummy ID, which
# makes a small database read. Only reads public endpoints; uses the public
# (publishable) key, never a secret.
name: Hacktoberfest Supabase keep-awake

on:
  schedule:
    - cron: "17 6 */3 * *"   # 06:17 UTC every 3rd day
  workflow_dispatch: {}       # can also be run by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping verify-certificate
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_KPo7PQvRavvuFTakkliT8w_yGtz8MAV" \
            "https://ahwtmyaqzkiekyywgyqw.supabase.co/functions/v1/verify-certificate?id=HF26-PING-PING")
          echo "verify-certificate answered HTTP $code"
          # 404 = function ran and found no such certificate (expected); anything else is a problem
          test "$code" = "404"
